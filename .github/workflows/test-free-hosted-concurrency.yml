name: Test free hosted concurrency

on:
  push:
    branches:
      - users/ericsciple/26-09-test-free-concurrency

jobs:
  macos:
    name: macOS slot ${{ matrix.slot }}
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    steps:
      - name: Hold concurrency slot
        run: |
          echo "Holding slot ${{ matrix.slot }}"
          sleep 300
