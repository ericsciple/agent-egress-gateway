name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          # There are no dependencies, so there is no go.sum to key a cache on.
          cache: false

      - name: Test
        run: go test -race ./...

      # The gateway only ever runs on Linux: on the Actions runner for
      # agent-microvm, and inside the guest for agent-sandbox.
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" \
              -o "dist/agent-gateway_linux_${arch}" ./cmd/agent-gateway
          done
          ls -lh dist/

      # Consumers verify against this rather than trusting the download.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum agent-gateway_linux_* > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        # Idempotent, but never destructive. A tag push and a manual dispatch can
        # target the same tag, so a second run must not fail outright, and it must
        # also not replace bytes that consumers have already pinned by digest:
        # a published tag has to keep meaning the same artifact. Only assets that
        # are missing get uploaded, which lets a partial failure be completed
        # without rewriting a finished release.
        run: |
          set -euo pipefail
          assets="agent-gateway_linux_amd64 agent-gateway_linux_arm64 SHA256SUMS"

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes \
              $(for a in $assets; do echo "dist/$a"; done)
            exit 0
          fi

          echo "release $TAG already exists; uploading only what is missing"
          existing=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          for a in $assets; do
            if grep -qx "$a" <<<"$existing"; then
              echo "  $a already published, leaving it alone"
            else
              echo "  uploading $a"
              gh release upload "$TAG" --repo "${{ github.repository }}" "dist/$a"
            fi
          done
